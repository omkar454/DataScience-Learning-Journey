<!DOCTYPE html>
<html>
<head>
<title>User Registration</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    background:white;
    padding:35px;
    width:350px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

input:focus{
    border-color:#2575fc;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    background:#2575fc;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1b5ed8;
}

#result{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

label{
    font-size:14px;
    color:#555;
}

</style>

<script>

function registerUser(){

    const formData = new FormData(document.getElementById("regForm"));

    fetch("/register", {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {

        const result = document.getElementById("result");

        if(data.status === "error"){
            result.style.color = "red";
            result.innerHTML = data.message;
        }
        else{
            result.style.color = "green";
            result.innerHTML = data.message;
            document.getElementById("regForm").reset();
        }

    });

    return false;
}

</script>

</head>

<body>

<div class="container">

<h2>User Registration</h2>

<form id="regForm" onsubmit="return registerUser()">

<label>Name</label>
<input type="text" name="name" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Age</label>
<input type="number" name="age" required>

<label>Username</label>
<input type="text" name="username" required>

<label>Password</label>
<input type="password" name="password" required>

<button type="submit">Register</button>

</form>

<div id="result"></div>

</div>

</body>
</html>
